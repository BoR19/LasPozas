<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tolomosita Oeste AquaLectura</title>
    <meta name="description" content="Offline-first water meter reading and billing system for community management." />
    <meta property="og:title" content="Tolomosita Oeste AquaLectura" />
    <meta property="og:description" content="Offline-first water meter reading and billing system for community management." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function() {
        // Suppress benign Vite dev server WebSocket connection errors (HMR is disabled in this environment)
        const isWsError = function(msg) {
          if (!msg) return false;
          const str = typeof msg === 'string' ? msg : (msg.message || msg.stack || String(msg));
          return str.includes('WebSocket') || str.includes('websocket') || str.includes('[vite]');
        };

        const originalError = console.error;
        console.error = function(...args) {
          if (args.some(arg => isWsError(arg))) {
            return;
          }
          originalError.apply(console, args);
        };

        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(arg => isWsError(arg))) {
            return;
          }
          originalWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || isWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
